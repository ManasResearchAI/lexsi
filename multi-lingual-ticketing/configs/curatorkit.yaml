name: multilingual_ticketing
version: "1.0.0"
readers:
  - type: jsonl
    path: data/processed/tickets/train.jsonl
    format: auto
gates:
  - type: schema
    required_fields: [messages]
    min_tokens: 1
    max_tokens: 1024
    use_tiktoken: false
normalizers:
  - type: minhash_dedup
    threshold: 0.9
exporters:
  - type: messages

